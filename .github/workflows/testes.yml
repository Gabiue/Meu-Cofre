name: testes

on:
  push:
    branches: [main, develop]  # as outras rodam pelo pull_request
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25  # um teste travado não pode prender o runner por horas
    env:
      QT_QPA_PLATFORM: offscreen  # sem tela
      MEU_COFRE_SEM_REDE: "1"     # testes nunca acessam a internet
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bibliotecas do Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-noto-core  # Noto Sans: a mesma fonte das medidas de layout dos testes
      - name: Dependências
        shell: bash
        run: uv sync --locked
      - name: Lint
        if: runner.os == 'Linux'
        run: uv run ruff check
      - name: Testes
        shell: bash
        # -v e faulthandler: se um teste travar, o log mostra qual e onde
        run: uv run pytest -q -v -o faulthandler_timeout=240
