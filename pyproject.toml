[project]
name = "meu-cofre"
version = "0.3.0"
description = "Ferramenta local de finanças pessoais: seus dados nunca saem do seu PC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyside6>=6.12",
]

[project.scripts]
meu-cofre = "meu_cofre.ui.app:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/meu_cofre"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # linhas longas são o estilo da casa (docstrings e SQL em uma linha)
    "E741",  # `l` pra lançamento é o costume do código
    "B905",  # zip sem strict: os pares vêm sempre do mesmo tamanho
]
