name: release

on:
  push:
    tags: ['v*']  # publica
  pull_request:  # só builda e faz fumaça
    paths:
      - scripts/build.py
      - scripts/entrada_executavel.py
      - .github/workflows/release.yml
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read  # só o job "publicar" escreve (cria o Release), e declara isso nele
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Bibliotecas do Qt
        if: runner.os == 'Linux'
        timeout-minutes: 10  # espelho do apt às vezes trava: melhor falhar rápido e rodar de novo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-noto-core
      - name: Dependências
        run: uv sync --locked --group build
      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Build e fumaça
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"  # o runner não tem FUSE
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            uv run --group build python scripts/build.py --fumaca --appimagetool ./appimagetool
          else
            uv run --group build python scripts/build.py --fumaca
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: meu-cofre-${{ runner.os }}
          path: |
            dist/meu-cofre.exe
            dist/meu-cofre-x86_64.AppImage
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" arquivos/meu-cofre.exe arquivos/meu-cofre-x86_64.AppImage --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
