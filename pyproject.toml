[project]
name = "meu-cofre"
version = "0.1.0"
description = "Ferramenta local de finanças pessoais: seus dados nunca saem do seu PC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyside6>=6.12",
]

[project.scripts]
meu-cofre = "meu_cofre.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/meu_cofre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
